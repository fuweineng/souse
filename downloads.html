<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souse 下载中心</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --accent:#22d3ee; --text:#e2e8f0; --muted:#94a3b8; --border:#334155; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
.container { max-width:900px; margin:0 auto; padding:2rem 1rem; }
header { text-align:center; margin-bottom:3rem; }
h1 { font-size:2.5rem; font-weight:700; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--accent),#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { color:var(--muted); font-size:1.1rem; }
.badge { display:inline-block; background:rgba(34,211,238,0.15); color:var(--accent); padding:0.25rem 0.75rem; border-radius:999px; font-size:0.85rem; margin-top:1rem; }
.platforms { display:grid; gap:1rem; }
@media (min-width:640px) { .platforms { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1024px) { .platforms { grid-template-columns:repeat(3,1fr); } }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; transition:transform .2s,box-shadow .2s; }
.card:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,0.3); }
.card-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
.icon { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
.icon.linux { background:rgba(34,211,238,0.2); color:var(--accent); }
.icon.macos { background:rgba(168,85,247,0.2); color:#a855f7; }
.icon.windows { background:rgba(59,130,246,0.2); color:#3b82f6; }
.platform-info h3 { font-size:1.1rem; font-weight:600; }
.platform-info span { color:var(--muted); font-size:0.85rem; }
.download-btn { display:block; width:100%; padding:0.75rem; background:var(--accent); color:#0f172a; font-weight:600; border:none; border-radius:8px; cursor:pointer; text-align:center; text-decoration:none; transition:opacity .2s; }
.download-btn:hover { opacity:0.9; }
.download-btn:disabled { opacity:0.5; cursor:not-allowed; }
.checksum { margin-top:1rem; padding:0.75rem; background:rgba(0,0,0,0.3); border-radius:6px; font-family:monospace; font-size:0.75rem; color:var(--muted); word-break:break-all; }
.checksum code { color:var(--text); }
.ver { color:var(--muted); font-size:0.85rem; text-align:center; margin-top:2rem; }
.quick-install { background:rgba(34,211,238,0.1); border:1px solid var(--accent); border-radius:12px; padding:1.5rem; margin-bottom:2rem; text-align:center; }
.quick-install code { background:rgba(0,0,0,0.3); padding:0.5rem 1rem; border-radius:6px; font-size:1rem; display:inline-block; margin:0.5rem 0; }
.quick-install a { color:var(--accent); }
footer { text-align:center; color:var(--muted); font-size:0.85rem; margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--border); }
</style>
</head>
<body>
<div class="container">
<header>
<p style="text-align:left;margin-bottom:2rem"><a href="/" style="color:var(--muted);text-decoration:none">← 返回首页</a></p>
<h1>Souse 下载中心</h1>
<p class="subtitle">出租屋管理系统 · 多平台安装包</p>
<span class="badge" id="version-badge">加载中…</span>
</header>

<div class="quick-install">
<p style="margin-bottom:0.5rem;">⚡ 推荐：一行命令自动识别平台并安装（Linux）</p>
<code>curl -fsSL https://souse.neng.page/install.sh | sudo sh</code>
<p style="margin-top:0.5rem; font-size:0.9rem; color:var(--muted);">装完会直接打印管理台地址和管理员初始密码。只看脚本不执行：<code>curl -fsSL https://souse.neng.page/install.sh</code></p>
</div>

<div class="platforms" id="platforms-grid">
<!-- JS 渲染 -->
</div>

<footer>
<p>所有产物均由 GitHub Actions 自动构建，附带 SHA256 校验文件</p>
<p><a href="https://github.com/fuweineng/souse/releases" target="_blank" style="color:var(--accent);">查看完整发布历史 →</a></p>
</footer>
</div>

<script>
const PLATFORMS = [
{id:"linux-amd64", name:"Linux", arch:"x86_64", ext:"tar.gz", icon:"🐧", class:"linux"},
{id:"linux-arm64", name:"Linux", arch:"ARM64", ext:"tar.gz", icon:"🐧", class:"linux"},
{id:"darwin-amd64", name:"macOS", arch:"Intel (x86_64)", ext:"tar.gz", icon:"🍎", class:"macos"},
{id:"darwin-arm64", name:"macOS", arch:"Apple Silicon (ARM64)", ext:"tar.gz", icon:"🍎", class:"macos"},
{id:"windows-amd64", name:"Windows", arch:"x86_64", ext:"zip", icon:"🪟", class:"windows"},
];

async function fetchLatestRelease() {
try {
const res = await fetch('https://api.github.com/repos/fuweineng/souse/releases/latest');
if (!res.ok) throw new Error('API 请求失败');
const data = await res.json();
return data;
} catch (e) {
console.error(e);
return null;
}
}

function renderPlatforms(release) {
const grid = document.getElementById('platforms-grid');
const version = release?.tag_name || 'v?.?.?';
document.getElementById('version-badge').textContent = `最新版本: ${version}`;

const assets = new Map((release?.assets || []).map(a => [a.name, a]));

PLATFORMS.forEach(p => {
const assetName = `souse-${p.id}.${p.ext}`;
const asset = assets.get(assetName);
const checksumName = `${assetName}.sha256`;
const checksumAsset = assets.get(checksumName);

const card = document.createElement('div');
card.className = 'card';

let btnHtml = '';
let checksumHtml = '';

if (asset) {
btnHtml = `<a class="download-btn" href="${asset.browser_download_url}" download>下载 ${assetName} (${(asset.size/1024/1024).toFixed(1)} MB)</a>`;
if (checksumAsset) {
checksumHtml = `<div class="checksum">SHA256: <code>${checksumAsset.name}</code> — <a href="${checksumAsset.browser_download_url}" target="_blank" style="color:var(--accent);">查看校验文件</a></div>`;
}
} else {
btnHtml = `<button class="download-btn" disabled>尚未发布该平台</button>`;
checksumHtml = `<div class="checksum">当前发行版只提供 Linux x86_64 二进制包。</div>`;
}

card.innerHTML = `
<div class="card-header">
<span class="icon ${p.class}">${p.icon}</span>
<div class="platform-info">
<h3>${p.name} ${p.arch}</h3>
<span>${assetName}</span>
</div>
</div>
${btnHtml}
${checksumHtml}
`;
grid.appendChild(card);
});
}

fetchLatestRelease().then(renderPlatforms);
</script>
</body>
</html>
